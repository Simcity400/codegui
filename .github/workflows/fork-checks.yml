name: Fork Checks

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Scan application source for secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          # Vendored read-only upstream references contain cryptographic test
          # fixtures. They are outside this application-source check.
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - name: Install pinned Gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan checked-out source
        run: '"$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact --no-banner'

  regressions:
    name: Build and sync regression tests
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=t3...
              - --filter=@t3tools/scripts...
      - name: Test release and sync behavior
        shell: bash
        run: |
          vp test run \
            scripts/fork-sync.test.ts \
            scripts/configure-fork-build.test.ts \
            scripts/fork-windows-update-selection.test.ts \
            scripts/pin-release-tag.test.ts \
            scripts/mobile-build-budget.test.ts \
            scripts/merge-update-manifests.test.ts
          node scripts/configure-fork-build.ts checks
          vp test run scripts/build-desktop-artifact.test.ts -t "Windows|sidecar|ASAR"
      - name: Typecheck the pipeline
        run: vp run --filter @t3tools/scripts typecheck
