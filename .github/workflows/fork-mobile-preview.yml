name: Personal iPhone Preview

on:
  workflow_dispatch:
    inputs:
      urgent_native_build:
        description: Skip the three-day native build cooldown (the budget cap still applies)
        type: boolean
        default: false
  # Retry deferred native changes even when no new commits arrive.
  schedule:
    - cron: "43 3 * * *"
  # fork-sync.yml calls this after it pushes a merged main. A push made with
  # GITHUB_TOKEN never fires `push` triggers, so without this entry the iPhone
  # OTA silently stopped tracking main whenever the scheduled sync — rather
  # than a human — was what moved it.
  workflow_call:
    inputs:
      ref:
        description: Exact main commit to publish
        required: true
        type: string
    secrets:
      EXPO_TOKEN:
        required: true
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/client-runtime/**
      - packages/contracts/**
      - packages/shared/**
      - assets/**
      - scripts/**
      - patches/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/fork-mobile-preview.yml

# Keep updates in commit order. If several pushes arrive while an iOS build is
# running, GitHub retains the newest queued run after the build finishes.
concurrency:
  group: personal-iphone-preview
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish updates and budget native builds
    # Stable across personal repository renames.
    if: github.repository_id == '1316734485'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      APP_VARIANT: preview
      MOBILE_VERSION_POLICY: fingerprint
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Check Expo credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "The EXPO_TOKEN repository secret is missing." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || (github.event_name == 'schedule' && 'main') || github.sha }}
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Check mobile features
        run: |
          vp run --filter @t3tools/mobile typecheck
          vp test run scripts/mobile-build-budget.test.ts packages/client-runtime/src/state/subagentRuntime.test.ts

      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          # Setup's token validation prints the account email. Authenticate only
          # the commands below, which already receive EXPO_TOKEN explicitly.
          packager: npm

      - name: Pull preview environment variables
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas env:pull preview --non-interactive

      - name: Find a compatible iPhone build
        id: fingerprint
        uses: expo/expo-github-action/continuous-deploy-fingerprint-info@main
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        with:
          profile: preview
          platform: ios
          environment: preview
          working-directory: apps/mobile

      # Publish before building so a bundling failure cannot spend a native build.
      # A daily retry with an existing runtime has no new update to publish.
      # Reusable nightly calls inherit the caller's scheduled event, but carry ref.
      - name: Publish the iPhone update
        if: github.event_name != 'schedule' || inputs.ref != '' || steps.fingerprint.outputs.ios-build-id == ''
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas update --auto --branch preview --platform ios --environment preview --non-interactive

      - name: Check the native build budget
        id: budget
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          COMPATIBLE_IOS_BUILD_ID: ${{ steps.fingerprint.outputs.ios-build-id }}
          URGENT_NATIVE_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.urgent_native_build == true }}
        run: node ../../scripts/mobile-build-budget.ts

      - name: Build a new iPhone runtime when needed
        if: steps.budget.outputs.build == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --profile preview --platform ios --non-interactive --wait
          echo 'Native inputs changed. Install the new iPhone preview build before expecting its over-the-air updates.' >> "$GITHUB_STEP_SUMMARY"
