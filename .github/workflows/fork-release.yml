name: Fork Release

# Fork-only pipeline: builds unsigned Windows installers (x64 and arm64) and
# publishes them as one GitHub prerelease on this repository. Packaged apps
# point their electron-updater feed here (GITHUB_REPOSITORY at build time), so
# the in-app update button picks these releases up; the merged update manifest
# lists both installers; the desktop adapter selects the native host CPU
# architecture before electron-updater caches or downloads the update. Kept separate from upstream's release.yml to avoid merge
# conflicts; that workflow needs T3's own secrets and runners and cannot run
# on this fork.

# Every direct push to main publishes the personal Windows build so the one
# installed app follows the same branch as mobile OTA and source checkouts.
# Markdown-only pushes do not spend a build. Workflow changes are release-relevant. workflow_dispatch remains available for a manual rebuild.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  workflow_call:
    inputs:
      ref:
        description: Exact main commit to package
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/fork-checks.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  prepare:
    name: Pin the release version and source
    needs: [checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      ready: ${{ steps.pin.outputs.ready }}
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      name: ${{ steps.release_meta.outputs.name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...
      - id: release_meta
        run: |
          node scripts/resolve-nightly-release.ts \
            --date "$(date -u +%Y%m%d)" \
            --run-number "${{ github.run_id }}" \
            --sha "$(git rev-parse HEAD)" \
            --github-output
      - id: pin
        name: Tag the checked source before main can advance during packaging
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: node scripts/pin-release-tag.ts

  build:
    name: Build Windows ${{ matrix.arch }}
    needs: [prepare]
    if: needs.prepare.outputs.ready == 'true' && github.repository == 'Simcity400/t3code-personal'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            rust_target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
    env:
      # T3 Connect public build config (same values as .env). These are the
      # public client-side values shipped inside the official T3 Code build —
      # not credentials. Without them, builds disable T3 Connect entirely
      # (no sign-in, no relay device connections).
      T3CODE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsudDMuY29kZXMk
      T3CODE_CLERK_JWT_TEMPLATE: t3-relay
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: hzxSgY2cH10sDU2r
      T3CODE_RELAY_URL: https://relay.t3.codes
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=t3...
              - --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.prepare.outputs.version }}"

      - name: Build desktop artifact
        shell: bash
        run: |
          vp run dist:desktop:artifact \
            --platform win \
            --target nsis \
            --arch ${{ matrix.arch }} \
            --build-version "${{ needs.prepare.outputs.version }}" \
            --verbose

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish

          shopt -s nullglob
          for pattern in \
            "release/*.exe" \
            "release/*.blockmap"; do
            for asset in $pattern; do
              cp "$asset" release-publish/
            done
          done

          # Each leg writes its own nightly.yml. Park it under an arch suffix
          # so the publish job can merge both into one manifest.
          if [[ ! -f release/nightly.yml ]]; then
            echo "Missing release/nightly.yml" >&2
            exit 1
          fi
          cp release/nightly.yml "release-publish/nightly-${{ matrix.arch }}.yml"

          ls -la release-publish

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-win-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish release
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-win-*
          merge-multiple: true
          path: release-publish

      - name: Merge updater manifests
        shell: bash
        run: |
          set -euo pipefail
          cd release-publish

          if [[ ! -f nightly-x64.yml ]]; then
            echo "Missing nightly-x64.yml: the x64 build is required" >&2
            exit 1
          fi

          if [[ ! -f nightly-arm64.yml ]]; then
            echo "Missing nightly-arm64.yml: both Windows architectures are required" >&2
            exit 1
          fi
          node ../scripts/merge-update-manifests.ts --platform win nightly-x64.yml nightly-arm64.yml nightly.yml
          rm -f nightly-x64.yml nightly-arm64.yml

          # Keep the latest channel alias for existing personal installations.
          cp nightly.yml latest.yml

          cat nightly.yml
          ls -la

      - name: Verify the reserved release tag
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          test "$(git ls-remote origin "refs/tags/$RELEASE_TAG" | cut -f1)" = "$(git rev-parse HEAD)"

      - name: Upload draft release
        id: upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          # The verified existing tag owns the source. Using the current branch
          # here avoids GitHub's workflow-permission check on stale commit metadata.
          target_commitish: main
          name: ${{ needs.prepare.outputs.name }}
          draft: true
          # Publish only after both architectures and manifests are verified.
          prerelease: false
          make_latest: false
          files: release-publish/*
          fail_on_unmatched_files: true

      - name: Verify assets and publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.upload.outputs.id }}
        run: |
          node scripts/fork-sync.ts verify-release
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -F prerelease=true
