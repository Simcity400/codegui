title = "T3 Code Personal source scanning"

[extend]
useDefault = true

# Upstream's local HTTP/2 test server uses this public, self-signed fixture.
# Match the full key as well as its test path so other private keys still fail.
[[allowlists]]
description = "Exact outbound HTTP TLS test key"
targetRules = ["private-key"]
condition = "AND"
paths = ['''(^|/)apps/server/src/outboundHttp\.test\.ts$''']
regexes = [
  '''^-----BEGIN PRIVATE KEY-----\r?\nMIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQg3EwCztQysKTvzdcR\r?\ng0LWq\+axzUd4tHi9PyMdqh7PlGShRANCAARfQpoLgv/tOsHWCLriDza7Ruaey2b7\r?\nmR/nS6mLu6W7\+agkEqDm0mE3F/ngpPjL4Jj0IGadeMcKNKFRSBgiLdfn\r?\n-----END PRIVATE KEY-----$''',
]

# Public client identifiers from .env.example, not server credentials.
[[allowlists]]
description = "Shipped Clerk publishable keys and public OAuth client ID"
targetRules = ["generic-api-key"]
regexes = ['''^pk_(live|test)_[A-Za-z0-9=]+$''', '''^hzxSgY2cH10sDU2r$''']

[[allowlists]]
description = "Pairing token alphabet, not a generated pairing token"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)apps/server/src/auth/PairingGrantStore\.ts$''']
regexes = ['''^23456789ABCDEFGHJKLMNPQRSTUVWXYZ$''']

[[allowlists]]
description = "Unsigned JWT fixture with a literal test signature"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)apps/mobile/src/features/cloud/linkEnvironment\.test\.ts$''']
regexes = ['''^eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0\.eyJzdWIiOiJ1c2VyXzEyMyJ9\.test$''']

[[allowlists]]
description = "RFC WebSocket handshake example nonce"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)apps/server/src/httpResponseErrorGuard\.test\.ts$''']
regexes = ['''^dGhlIHNhbXBsZSBub25jZQ==$''']

[[allowlists]]
description = "Protocol test idempotency UUID"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)packages/effect-codex-app-server/src/protocol\.test\.ts$''']
regexes = ['''^8ae96ff3-3425-4f4c-8772-b6fd61502868$''']

[[allowlists]]
description = "Default keyboard shortcuts, not API credentials"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''(^|/)packages/shared/src/keybindings\.ts$''',
  '''(^|/)apps/web/src/components/settings/KeybindingsSettings\.logic\.test\.ts$''',
]
regexes = ['''^mod\+shift\+(enter|arrowup|arrowdown)$''']

[[allowlists]]
description = "HTML image safety fixture containing a dummy API key"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)apps/server/src/htmlRender/HtmlRender\.test\.ts$''']
regexes = ['''^API_KEY=abc123$''']

[[allowlists]]
description = "Managed endpoint test IDs using forward and reverse hexadecimal alphabets"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''(^|/)infra/relay/src/hooks/HeldHooks\.test\.ts$''',
  '''(^|/)infra/relay/src/hooks/HookForwarder\.test\.ts$''',
  '''(^|/)infra/relay/src/http/Api\.test\.ts$''',
]
regexes = ['''^0123456789abcdef$''', '''^fedcba9876543210$''']

# These are SHA-256 fingerprints of the literal dummy keys in this test, not credentials.
[[allowlists]]
description = "OpenCode test credential fingerprints"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)packages/provider-opencode/src/server/status\.test\.ts$''']
regexes = [
  '''^3e45cfde9158185930d4cc7020a4e390895574fd54bd8f9631d23a336bbf94f0$''',
  '''^d0e590e93fc9bd9353f2b993c0c287391cae505da2a78cb698b75418d2f5367e$''',
  '''^85649de18e63305548b6407e185f708483727ee6189cc4bc9512ddb17e23e776$''',
]
