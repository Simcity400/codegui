name: Fork Sync

# Follow official main while retaining only the personal build/publish pipeline.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  gate:
    name: Check official main and missing builds
    if: github.repository_id == '1316734485'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.check.outputs.commit }}
      sync: ${{ steps.check.outputs.sync }}
      release: ${{ steps.check.outputs.release }}
      ref: ${{ steps.check.outputs.ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fork-sync.ts check

  sync:
    name: Restore application code from official main
    needs: gate
    if: needs.gate.outputs.sync == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      ref: ${{ steps.merge.outputs.ref }}
    steps:
      # The merge needs upstream objects; use a full clone rather than a promisor clone.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - id: merge
        env:
          UPSTREAM_COMMIT: ${{ needs.gate.outputs.commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/fork-sync.ts merge
          git push origin HEAD:main
      - name: Clear the old blocked-sync marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/needs-merge-help" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/needs-merge-help"
          fi

  release:
    name: Publish the personal Windows update
    needs: [gate, sync]
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.gate.outputs.release == 'true' && (needs.sync.result == 'success' || needs.sync.result == 'skipped') }}
    uses: ./.github/workflows/fork-release.yml
    with:
      ref: ${{ needs.sync.outputs.ref || needs.gate.outputs.ref }}
    permissions:
      contents: write

  mobile:
    name: Publish the synced iPhone update
    needs: sync
    uses: ./.github/workflows/fork-mobile-preview.yml
    with:
      ref: ${{ needs.sync.outputs.ref }}
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    permissions:
      contents: read
