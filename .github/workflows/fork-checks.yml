name: Fork Checks

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Scan application source for secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          # Vendored read-only upstream references contain cryptographic test
          # fixtures. They are outside this application-source check.
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - name: Install pinned Gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan checked-out source
        run: '"$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact --no-banner'

  regressions:
    name: Fork regression tests
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=t3...
              - --filter=@t3tools/scripts...
              - --filter=@t3tools/web...
              - --filter=@t3tools/mobile...
      - name: Test release and update behavior
        shell: bash
        run: |
          vp test run \
            scripts/fork-sync.test.ts \
            scripts/mobile-build-budget.test.ts \
            scripts/merge-update-manifests.test.ts \
            apps/desktop/src/updates/DesktopUpdates.test.ts \
            apps/desktop/src/updates/updateMachine.test.ts \
            apps/desktop/src/updates/windowsUpdateSelection.test.ts \
            apps/desktop/src/electron/ElectronUpdater.windows.test.ts \
            apps/server/src/provider/Layers/CodexSessionRuntime.test.ts \
            apps/server/src/relay/AgentAwarenessRelay.test.ts \
            apps/server/src/auth/RpcAuthorization.test.ts \
            packages/contracts/src/codexGoal.test.ts \
            apps/server/src/orchestration/projector.goal.test.ts \
            apps/server/src/persistence/ForkCompatibility.test.ts \
            apps/server/src/persistence/Layers/OrchestrationEventStore.test.ts \
            apps/server/src/persistence/Layers/ProjectionThreadMessages.test.ts \
            packages/client-runtime/src/state/subagentRuntime.test.ts \
            packages/client-runtime/src/state/agentTranscripts.test.ts \
            packages/client-runtime/src/state/subagentPresentation.test.ts \
            apps/mobile/src/features/agents/agentListRows.test.ts \
            packages/client-runtime/src/state/sideChat.test.ts \
            packages/client-runtime/src/state/codexGoal.test.ts \
            apps/server/src/provider/Layers/CodexAdapter.test.ts \
            apps/server/src/provider/Layers/ClaudeAdapter.test.ts \
            apps/server/src/provider/Layers/ProviderService.test.ts \
            apps/server/src/orchestration/Layers/ProviderRuntimeIngestion.test.ts \
            apps/server/src/orchestration/Layers/ProjectionPipeline.test.ts \
            apps/server/src/orchestration/Layers/ProjectionSnapshotQuery.test.ts \
            apps/desktop/src/updates/upstreamMerge.test.ts \
            packages/shared/src/composerTrigger.test.ts
          vp test run scripts/build-desktop-artifact.test.ts -t "Windows|sidecar|ASAR"
      - name: Test web feature controls
        working-directory: apps/web
        run: vp test run --project unit src/components/chat/useCodexGoalControls.test.tsx src/components/chat/AgentTranscript.test.ts src/components/sidebar/upstreamMerge.logic.test.ts src/components/RightPanelTabs.test.tsx
      - name: Typecheck retained feature packages
        run: vp run --filter @t3tools/contracts --filter @t3tools/client-runtime --filter @t3tools/web --filter @t3tools/mobile --filter t3 --filter @t3tools/desktop --filter @t3tools/scripts --concurrency-limit 2 typecheck
